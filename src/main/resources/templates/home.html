<!--${prefix}-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Left Sidebar Layout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
        }

        /* 사이드바 스타일 */
        .sidebar {
            width: 250px;
            height: 100vh;
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            position: fixed;
            overflow-y: auto;
        }

        .sidebar h2 {
            margin-bottom: 20px;
            font-size: 24px;
        }

        .sidebar ul {
            list-style: none;
        }

        .sidebar ul li {
            margin: 10px 0;
        }

        .sidebar ul li a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        .sidebar ul li a:hover {
            text-decoration: underline;
        }

        /* 메인 콘텐츠 스타일 */
        .main-content {
            margin-left: 250px; /* 사이드바의 너비만큼 여백 추가 */
            padding: 20px;
            width: calc(100% - 250px); /* 사이드바 제외한 너비 */
        }

        .open-modal-btn {
            margin: 20px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .open-modal-btn:hover {
            background-color: #2980b9;
        }

        /* 모달 배경 */
        .modal-overlay {
            display: none; /* 기본적으로 숨김 */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }

        /* 모달 창 */
        .modal {
            background: white;
            width: 400px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .modal-header {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .modal-body {
            margin-bottom: 20px;
        }

        /* 닫기 버튼 */
        .close-modal-btn {
            display: inline-block;
            padding: 8px 15px;
            font-size: 14px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .add-company {
            display: inline-block;
            padding: 8px 15px;
            font-size: 14px;
            background-color: black;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .close-modal-btn:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>
<!-- 왼쪽 사이드바 -->


<div class="sidebar">
    <h2>지원 회사</h2>
    <button class="open-modal-btn" onclick="openModal()">회사 추가</button>
    <!-- 모달 창 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-body">
                <p style="color: black;">회사를 추가하기 위한 내용을 입력하세요.</p>
                <label>
                    <input id="companyNameInput" type="text" placeholder="회사명"
                           style="width: 100%; padding: 10px; margin-bottom: 10px;">
                </label>
            </div>
            <button class="add-company" onclick="addCompany()">추가</button>
            <button class="close-modal-btn" onclick="closeModal()">닫기</button>
        </div>
    </div>
    <ul>

    </ul>
</div>

<!-- 메인 콘텐츠 -->
<div class="main-content">
    <h1>Welcome to the Main Content</h1>
    <p>This is where the main content goes. You can add any content here.</p>
    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Suspendisse eget eros a erat facilisis tincidunt.</p>
</div>

<script>
    // 모달 열기
    function openModal() {
        document.getElementById('modalOverlay').style.display = 'flex';
    }

    // 모달 닫기
    function closeModal() {
        document.getElementById('modalOverlay').style.display = 'none';
    }

    function addCompany() {
        const companyName = document.getElementById('companyNameInput').value;

        const requestData = {
            name: companyName
        };

        // POST 요청 보내기
        fetch('/api/company', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json', // JSON 데이터임을 명시
            },
            body: JSON.stringify(requestData), // 데이터를 JSON 문자열로 변환
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error('네트워크 응답에 문제가 있습니다.');
                }
                return response.json(); // 서버에서 반환된 JSON 데이터를 파싱
            })
            .then(data => {
                console.log("서버 응답:", data); // 성공적으로 응답받은 데이터를 처리
                alert("회사 추가 완료!");
                closeModal(); // 모달 닫기
            })
            .catch(error => {
                console.error("에러 발생:", error);
                alert("회사 추가에 실패했습니다.");
            });
    }
</script>
</body>
</html>
